name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste real recipient data, secrets, tokens or full .env files. Use example.com addresses.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran (with --mode dry-run if possible) and a minimal campaign layout.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mailroll version (mailroll --version)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
